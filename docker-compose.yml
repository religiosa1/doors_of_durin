# An example compose file for testing
#
# To test manually:
#
# ```sh
# docker compose up --build
# # Adding a user through the cli
# docker compose exec auth /durin user add --password test_password test_user
# ```
#
# Then visit http://localhost:8000/app/ and http://localhost:8000/files/index.html
#
services:
  auth:
    build: .
    environment:
      HOST: "0.0.0.0"
      DB_FILE: "/data/durin.sqlite3"
      LOG_TYPE: "text"
      URL_PREFIX: "/auth"
    volumes:
      - auth_data:/data

  # traefik whoami to check reverse proxy setup + see X-Auth-User value
  backend:
    image: traefik/whoami

  # Nginx that performs forward_auth. See it's config in ./nginx/nginx.conf
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Some static for testing as well, lives in nginx/static/index.html
      - ./nginx/static:/var/www/static:ro
    depends_on:
      - auth
      - backend

volumes:
  auth_data:
